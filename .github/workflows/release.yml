# Builds a signed APK for a version tag (vX.Y.Z) and publishes it as a GitHub release.
# The app checks the latest release and updates itself from it (see app/.../update/Updater.kt).
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   SIGNING_KEYSTORE_BASE64    release keystore (PKCS12), base64-encoded
#   SIGNING_KEYSTORE_PASSWORD  its password
#   SIGNING_KEY_ALIAS          key alias inside it
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET  Google sign-in (optional; without them the
#                              subscriptions / likes tabs can't sign in)
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this release already has an APK
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.apk$'; then
            echo "Release $GITHUB_REF_NAME already has an APK, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check signing secrets
        if: steps.existing.outputs.skip != 'true'
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          # A release signed with any other key could not be installed over the app, so stop.
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ] || [ -z "$ALIAS" ]; then
            echo "::error::Signing secrets are missing (see the top of this workflow)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        if: steps.existing.outputs.skip != 'true'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.existing.outputs.skip != 'true'

      - name: Unit tests
        if: steps.existing.outputs.skip != 'true'
        run: ./gradlew :app:testDebugUnitTest

      - name: Build signed APK
        if: steps.existing.outputs.skip != 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          export SIGNING_KEYSTORE="$RUNNER_TEMP/release.p12"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$SIGNING_KEYSTORE"
          ./gradlew :app:assembleRelease -PappVersion="${GITHUB_REF_NAME#v}"
          rm -f "$SIGNING_KEYSTORE"

      - name: Publish release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="rokid-youtube-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --title "$GITHUB_REF_NAME" --generate-notes
          fi
