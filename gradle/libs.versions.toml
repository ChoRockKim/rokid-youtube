[versions]
agp = "9.2.1"
kotlin = "2.4.0"
activity = "1.13.0"
coil = "3.5.0"
core = "1.18.0"
coroutines = "1.11.0"
desugar = "2.1.5"
exoplayer = "2.19.1"
junit = "4.13.2"
lifecycle = "2.10.0"
newpipe-extractor = "v0.26.3"
nanojson = "e9d656ddb49a412a5a0a5d5ef20ca7ef09549996"
okhttp = "5.4.0"
paparazzi = "2.0.0-alpha05.1"
recyclerview = "1.4.0"
rxandroid = "3.0.2"
rxjava = "3.1.12"
webkit = "1.15.0"

[libraries]
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
desugar = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar" }
exoplayer-core = { module = "com.google.android.exoplayer:exoplayer-core", version.ref = "exoplayer" }
exoplayer-dash = { module = "com.google.android.exoplayer:exoplayer-dash", version.ref = "exoplayer" }
